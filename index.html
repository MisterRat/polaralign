  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Astronomy utils
      function calculateMagneticDeclination(lat, lon) {
        const rad = Math.PI / 180;
        const dec = 0.17 * Math.sin(lon * rad) * Math.cos(lat * rad) - 0.05 * (lon / 30) + (lat > 0 ? 0.0008 * lat : -0.0012 * lat);
        if (lat >= 20 && lat <= 65 && lon >= -170 && lon <= -50) {
          const usApprox = -0.15 * (lon + 95) + 0.05 * (lat - 40);
          return Math.round((usApprox * 0.8 + dec * 0.2) * 10) / 10;
        }
        if (lat >= 35 && lat <= 70 && lon >= -10 && lon <= 40) {
          const euApprox = 3.0 + 0.08 * (lon - 10) - 0.05 * (lat - 50);
          return Math.round(euApprox * 10) / 10;
        }
        return Math.round(dec * 10) / 10;
      }

      function normalizeAngle(angle) {
        let norm = angle % 360;
        if (norm < 0) norm += 360;
        return norm;
      }

      function getHeadingDifference(current, target) {
        let diff = (target - current) % 360;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        return diff;
      }

      // React SVG Icon Component (Native JSX rendering - prevents DOM mutation crashes)
      function Icon({ name, className = "w-4 h-4" }) {
        const props = {
          className,
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round"
        };

        switch (name) {
          case 'compass':
            return (
              <svg {...props}>
                <circle cx="12" cy="12" r="10" />
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
              </svg>
            );
          case 'rotate-cw':
            return (
              <svg {...props}>
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
              </svg>
            );
          case 'navigation':
            return (
              <svg {...props}>
                <polygon points="3 11 22 2 13 21 11 13 3 11" />
              </svg>
            );
          case 'shield-check':
            return (
              <svg {...props}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                <polyline points="9 11 12 14 22 4" />
              </svg>
            );
          case 'check-circle-2':
            return (
              <svg {...props}>
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
                <path d="m9 12 2 2 4-4" />
              </svg>
            );
          case 'map-pin':
            return (
              <svg {...props}>
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
            );
          case 'sparkles':
            return (
              <svg {...props}>
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z" />
              </svg>
            );
          case 'x':
            return (
              <svg {...props}>
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            );
          case 'info':
            return (
              <svg {...props}>
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
            );
          case 'external-link':
            return (
              <svg {...props}>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
            );
          case 'activity':
            return (
              <svg {...props}>
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
              </svg>
            );
          case 'play':
            return (
              <svg {...props}>
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
            );
          case 'pause':
            return (
              <svg {...props}>
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
              </svg>
            );
          case 'trash-2':
            return (
              <svg {...props}>
                <path d="M3 6h18" />
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                <line x1="10" y1="11" x2="10" y2="17" />
                <line x1="14" y1="11" x2="14" y2="17" />
              </svg>
            );
          case 'square':
            return (
              <svg {...props}>
                <rect x="5" y="5" width="14" height="14" rx="2" />
              </svg>
            );
          case 'zap':
            return (
              <svg {...props}>
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
              </svg>
            );
          default:
            return null;
        }
      }

      function App() {
        const [isInIframe, setIsInIframe] = useState(false);

        // GPS State
        const [location, setLocation] = useState(null);
        const [gpsStatus, setGpsStatus] = useState('pending');
        const [gpsErrorMsg, setGpsErrorMsg] = useState(null);

        // Orientation Sensor State
        const [sensorStatus, setSensorStatus] = useState('pending');
        const [sensorErrorMsg, setSensorErrorMsg] = useState(null);
        const [sensorActive, setSensorActive] = useState(false);
        const [orientation, setOrientation] = useState({ heading: null, pitch: 0, roll: 0 });

        // Manual Gyro / Simulation Mode State (for testing & desktop)
        const [manualSensorMode, setManualSensorMode] = useState(false);
        const [simHeading, setSimHeading] = useState(15);
        const [simPitch, setSimPitch] = useState(35);

        // Smoothing refs (EMA)
        const smoothedHeadingRef = useRef(null);
        const smoothedPitchRef = useRef(0);
        const smoothedRollRef = useRef(0);

        // Calibration wizard state
        const [showCalibrationModal, setShowCalibrationModal] = useState(false);
        const [calibrationProgress, setCalibrationProgress] = useState(0);
        const [isCalibrating, setIsCalibrating] = useState(false);
        const [calibratedSuccessfully, setCalibratedSuccessfully] = useState(false);

        // Manual Input modal
        const [showManualModal, setShowManualModal] = useState(false);
        const [manualLatInput, setManualLatInput] = useState('37.7749');
        const [manualLonInput, setManualLonInput] = useState('-122.4194');

        // Mount Stability Monitor State
        const [stabilityHistory, setStabilityHistory] = useState([]);
        const [isMonitoringActive, setIsMonitoringActive] = useState(false);
        const [currentAccValue, setCurrentAccValue] = useState(0);
        const [currentMss, setCurrentMss] = useState(0);

        // Sync location state to manual inputs so modal displays active GPS coordinates
        useEffect(() => {
          if (location && typeof location.latitude === 'number' && typeof location.longitude === 'number') {
            setManualLatInput(location.latitude.toFixed(4));
            setManualLonInput(location.longitude.toFixed(4));
          }
        }, [location]);

        useEffect(() => {
          setIsInIframe(window.self !== window.top);
        }, []);

        const openStandaloneWindow = () => {
          window.open(window.location.href, '_blank', 'noopener,noreferrer');
        };

        // Calibration timer
        useEffect(() => {
          let timer;
          let interval;
          if (isCalibrating) {
            setCalibrationProgress(0);
            const startTime = Date.now();
            const duration = 6000;

            interval = setInterval(() => {
              const elapsed = Date.now() - startTime;
              const prog = Math.min(100, (elapsed / duration) * 100);
              setCalibrationProgress(prog);
            }, 50);

            timer = setTimeout(() => {
              setIsCalibrating(false);
              setCalibratedSuccessfully(true);
              clearInterval(interval);
            }, duration);
          }
          return () => {
            clearTimeout(timer);
            clearInterval(interval);
          };
        }, [isCalibrating]);

        // Robust Sensor Listener effect
        useEffect(() => {
          if (sensorStatus !== 'granted') return;

          let rafId = null;
          let lastAbsTime = 0;
          let latestAbsEvent = null;
          let latestRelEvent = null;

          const processLatestEvent = () => {
            rafId = null;
            const now = performance.now();
            
            let rawHeading = null;

            // 1. iOS webkitCompassHeading (High Precision Magnetic North)
            if (latestAbsEvent && typeof latestAbsEvent.webkitCompassHeading === 'number' && !isNaN(latestAbsEvent.webkitCompassHeading)) {
              rawHeading = latestAbsEvent.webkitCompassHeading;
              lastAbsTime = now;
            }
            // 2. Android deviceorientationabsolute (Magnetic North)
            else if (latestAbsEvent && typeof latestAbsEvent.alpha === 'number' && latestAbsEvent.alpha !== null && !isNaN(latestAbsEvent.alpha)) {
              rawHeading = normalizeAngle(360 - latestAbsEvent.alpha);
              lastAbsTime = now;
            }
            // 3. Fallback to standard deviceorientation if no absolute event in last 2 seconds
            else if (latestRelEvent && (now - lastAbsTime > 2000)) {
              if (typeof latestRelEvent.alpha === 'number' && latestRelEvent.alpha !== null && !isNaN(latestRelEvent.alpha)) {
                rawHeading = normalizeAngle(360 - latestRelEvent.alpha);
              }
            }

            // Pitch & Roll
            const activeEv = latestAbsEvent || latestRelEvent;
            let rawPitch = 0;
            let rawRoll = 0;

            if (activeEv) {
              if (typeof activeEv.beta === 'number' && activeEv.beta !== null && !isNaN(activeEv.beta)) {
                rawPitch = activeEv.beta;
              }
              if (typeof activeEv.gamma === 'number' && activeEv.gamma !== null && !isNaN(activeEv.gamma)) {
                rawRoll = activeEv.gamma;
              }
            }

            // Screen orientation compensation (Portrait vs Landscape)
            const screenAngle = (screen.orientation && typeof screen.orientation.angle === 'number') 
              ? screen.orientation.angle 
              : (typeof window.orientation === 'number' ? window.orientation : 0);

            let effectivePitch = rawPitch;
            let effectiveRoll = rawRoll;

            if (screenAngle === 90) {
              effectivePitch = rawRoll;
              effectiveRoll = -rawPitch;
            } else if (screenAngle === -90 || screenAngle === 270) {
              effectivePitch = -rawRoll;
              effectiveRoll = rawPitch;
            } else if (screenAngle === 180) {
              effectivePitch = -rawPitch;
              effectiveRoll = -rawRoll;
            }

            // Enhanced Adaptive Exponential Moving Average (EMA) Low-Pass Filter
            // Dynamic alpha dampens sensor noise when stationary (alpha=0.06)
            // and responds rapidly during deliberate rotation or tilt (alpha=0.22).
            if (rawHeading !== null) {
              let curH = smoothedHeadingRef.current;
              if (curH === null) {
                curH = rawHeading;
              } else {
                let diff = (rawHeading - curH) % 360;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                const absDiff = Math.abs(diff);
                const alphaH = absDiff < 1.0 ? 0.06 : (absDiff > 6.0 ? 0.22 : 0.06 + (absDiff - 1.0) * 0.032);
                curH = normalizeAngle(curH + diff * alphaH);
              }
              smoothedHeadingRef.current = curH;
            }

            const diffP = effectivePitch - smoothedPitchRef.current;
            const absDiffP = Math.abs(diffP);
            const alphaP = absDiffP < 0.5 ? 0.06 : (absDiffP > 4.0 ? 0.22 : 0.06 + (absDiffP - 0.5) * 0.045);
            const curP = smoothedPitchRef.current + diffP * alphaP;
            smoothedPitchRef.current = curP;

            const diffR = effectiveRoll - smoothedRollRef.current;
            const absDiffR = Math.abs(diffR);
            const alphaR = absDiffR < 0.5 ? 0.06 : (absDiffR > 4.0 ? 0.22 : 0.06 + (absDiffR - 0.5) * 0.045);
            const curR = smoothedRollRef.current + diffR * alphaR;
            smoothedRollRef.current = curR;

            setSensorActive(true);
            setOrientation({
              heading: smoothedHeadingRef.current,
              pitch: curP,
              roll: curR
            });
          };

          const handleAbsoluteOrientation = (e) => {
            if (typeof e.webkitCompassHeading === 'number' || e.absolute === true || e.type === 'deviceorientationabsolute') {
              latestAbsEvent = e;
            } else {
              latestRelEvent = e;
            }
            if (rafId === null) {
              rafId = requestAnimationFrame(processLatestEvent);
            }
          };

          const handleRelativeOrientation = (e) => {
            if (typeof e.webkitCompassHeading === 'number') {
              latestAbsEvent = e;
            } else if (e.absolute === true) {
              latestAbsEvent = e;
            } else {
              latestRelEvent = e;
            }
            if (rafId === null) {
              rafId = requestAnimationFrame(processLatestEvent);
            }
          };

          window.addEventListener('deviceorientationabsolute', handleAbsoluteOrientation, true);
          window.addEventListener('deviceorientation', handleRelativeOrientation, true);

          return () => {
            if (rafId !== null) {
              cancelAnimationFrame(rafId);
            }
            window.removeEventListener('deviceorientationabsolute', handleAbsoluteOrientation, true);
            window.removeEventListener('deviceorientation', handleRelativeOrientation, true);
          };
        }, [sensorStatus]);

        const requestGpsAndSensors = async () => {
          setGpsStatus('requesting');
          setSensorStatus('requesting');
          setGpsErrorMsg(null);
          setSensorErrorMsg(null);

          // 1. GPS Location Request
          if ('geolocation' in navigator && navigator.geolocation) {
            const handleGpsSuccess = (pos) => {
              const lat = pos.coords.latitude;
              const lon = pos.coords.longitude;
              const dec = calculateMagneticDeclination(lat, lon);
              setLocation({
                latitude: lat,
                longitude: lon,
                declination: dec,
                accuracy: pos.coords.accuracy,
                timestamp: pos.timestamp,
                source: 'gps'
              });
              setManualLatInput(lat.toString());
              setManualLonInput(lon.toString());
              setGpsStatus('granted');
            };

            const handleGpsError = (err) => {
              // Automatically use default location on GPS failure so user isn't stuck
              const defaultLat = 37.7749;
              const defaultLon = -122.4194;
              const dec = calculateMagneticDeclination(defaultLat, defaultLon);
              setLocation({
                latitude: defaultLat,
                longitude: defaultLon,
                declination: dec,
                accuracy: null,
                timestamp: Date.now(),
                source: 'default'
              });
              setGpsStatus('granted');
              setGpsErrorMsg('GPS location unavailable. Applied default coordinates (37.77° N, -122.42° W). Tap header to edit location.');
            };

            navigator.geolocation.getCurrentPosition(
              handleGpsSuccess,
              handleGpsError,
              { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
            );
          } else {
            const defaultLat = 37.7749;
            const defaultLon = -122.4194;
            const dec = calculateMagneticDeclination(defaultLat, defaultLon);
            setLocation({
              latitude: defaultLat,
              longitude: defaultLon,
              declination: dec,
              accuracy: null,
              timestamp: Date.now(),
              source: 'default'
            });
            setGpsStatus('granted');
          }

          // 2. Motion Sensors Request
          try {
            const DeviceOrientationWindow = window;
            if (
              typeof DeviceOrientationWindow.DeviceOrientationEvent !== 'undefined' &&
              typeof DeviceOrientationWindow.DeviceOrientationEvent.requestPermission === 'function'
            ) {
              const res = await DeviceOrientationWindow.DeviceOrientationEvent.requestPermission();
              if (res === 'granted') {
                setSensorStatus('granted');
              } else {
                setSensorStatus('granted');
                setManualSensorMode(true);
                setSensorErrorMsg('Motion sensors blocked on iOS. Enabled Manual Simulation mode.');
              }
            } else if ('DeviceOrientationEvent' in window) {
              setSensorStatus('granted');
            } else {
              setSensorStatus('granted');
              setManualSensorMode(true);
            }
          } catch (e) {
            setSensorStatus('granted');
            setManualSensorMode(true);
          }
        };

        const handleUseDefaultLocation = () => {
          const defaultLat = 37.7749;
          const defaultLon = -122.4194;
          const dec = calculateMagneticDeclination(defaultLat, defaultLon);
          setLocation({
            latitude: defaultLat,
            longitude: defaultLon,
            declination: dec,
            accuracy: null,
            timestamp: Date.now(),
            source: 'manual'
          });
          setGpsStatus('granted');
          setSensorStatus('granted');
        };

        const handleApplyManualGps = (e) => {
          e.preventDefault();
          const lat = parseFloat(manualLatInput);
          const lon = parseFloat(manualLonInput);
          if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
            const dec = calculateMagneticDeclination(lat, lon);
            setLocation({
              latitude: lat,
              longitude: lon,
              declination: dec,
              accuracy: null,
              timestamp: Date.now(),
              source: 'manual'
            });
            setGpsStatus('granted');
            setShowManualModal(false);
          }
        };

        const isReady = (gpsStatus === 'granted' && location) && (sensorStatus === 'granted');

        const currentLat = location ? location.latitude : 0;
        const decOffset = location ? location.declination : 0;
        
        const isSouthern = currentLat < 0;
        const targetPole = isSouthern ? 'True South' : 'True North';
        const targetBearing = isSouthern ? 180 : 0;

        const sensorPitch = orientation.pitch !== null ? Math.abs(orientation.pitch) : 0;
        const isParallelMode = !manualSensorMode && sensorPitch > 90;

        const sensorHeading = orientation.heading !== null ? orientation.heading : simHeading;
        const rawHeading = manualSensorMode ? simHeading : sensorHeading;

        const magHeading = normalizeAngle(rawHeading);
        const trueHeading = normalizeAngle(magHeading + decOffset);

        const azDiff = getHeadingDifference(trueHeading, targetBearing);
        const absAzError = Math.abs(azDiff);
        const azLocked = absAzError <= 1.5;

        const targetAlt = Math.abs(currentLat);
        const rawPitch = manualSensorMode
          ? simPitch
          : (isParallelMode ? Math.abs(180 - sensorPitch) : sensorPitch);

        const altError = rawPitch - targetAlt;
        const absAltError = Math.abs(altError);
        const altLocked = absAltError <= 1.0;

        // Device Motion listener for real hardware sensors
        useEffect(() => {
          if (!isMonitoringActive) return;

          let gravityEstimate = { x: 0, y: 0, z: 9.81 };
          let initializedGravity = false;
          let lastSampleTime = 0;

          const handleMotion = (event) => {
            if (document.visibilityState !== 'visible') return;

            // Continuous gravity estimation tracking for smooth high-pass filtering
            if (event.accelerationIncludingGravity && (event.accelerationIncludingGravity.x !== null || event.accelerationIncludingGravity.y !== null || event.accelerationIncludingGravity.z !== null)) {
              const rawX = event.accelerationIncludingGravity.x || 0;
              const rawY = event.accelerationIncludingGravity.y || 0;
              const rawZ = event.accelerationIncludingGravity.z || 0;
              
              if (!initializedGravity) {
                gravityEstimate = { x: rawX, y: rawY, z: rawZ };
                initializedGravity = true;
              } else {
                const alpha = 0.95;
                gravityEstimate.x = alpha * gravityEstimate.x + (1 - alpha) * rawX;
                gravityEstimate.y = alpha * gravityEstimate.y + (1 - alpha) * rawY;
                gravityEstimate.z = alpha * gravityEstimate.z + (1 - alpha) * rawZ;
              }
            }

            const now = Date.now();
            if (now - lastSampleTime < 200) return;
            lastSampleTime = now;

            let accMag = 0;

            if (event.acceleration && (event.acceleration.x !== null || event.acceleration.y !== null || event.acceleration.z !== null)) {
              const ax = event.acceleration.x || 0;
              const ay = event.acceleration.y || 0;
              const az = event.acceleration.z || 0;
              accMag = Math.sqrt(ax * ax + ay * ay + az * az);
            } else if (event.accelerationIncludingGravity) {
              const rawX = event.accelerationIncludingGravity.x || 0;
              const rawY = event.accelerationIncludingGravity.y || 0;
              const rawZ = event.accelerationIncludingGravity.z || 0;

              const linX = rawX - gravityEstimate.x;
              const linY = rawY - gravityEstimate.y;
              const linZ = rawZ - gravityEstimate.z;

              accMag = Math.sqrt(linX * linX + linY * linY + linZ * linZ);
            }

            // Subtract sensor baseline noise floor (~0.02 m/s²) and scale 1.0 m/s² acceleration to 100%
            const netAcc = Math.max(0, accMag - 0.02);
            const percentVal = Math.min(100, Math.max(0, netAcc * 100));

            setCurrentMss(accMag);
            setCurrentAccValue(percentVal);

            setStabilityHistory((prev) => {
              const fiveMinAgo = now - 300000;
              const filtered = prev.filter((pt) => pt.time >= fiveMinAgo);
              return [...filtered.slice(-500), { time: now, value: percentVal, mss: accMag }];
            });
          };

          window.addEventListener('devicemotion', handleMotion, true);

          return () => {
            window.removeEventListener('devicemotion', handleMotion, true);
          };
        }, [isMonitoringActive]);

        // Background ambient vibration simulation in manual sensor mode
        useEffect(() => {
          if (!isMonitoringActive || !manualSensorMode) return;

          const interval = setInterval(() => {
            if (document.visibilityState !== 'visible') return;
            const now = Date.now();
            const baseNoiseAcc = 0.005 + Math.random() * 0.015;
            const netAcc = Math.max(0, baseNoiseAcc - 0.002);
            const percentVal = Math.min(100, Math.max(0, netAcc * 100));

            setCurrentMss(baseNoiseAcc);
            setCurrentAccValue(percentVal);

            setStabilityHistory((prev) => {
              const fiveMinAgo = now - 300000;
              const filtered = prev.filter((pt) => pt.time >= fiveMinAgo);
              return [...filtered.slice(-500), { time: now, value: percentVal, mss: baseNoiseAcc }];
            });
          }, 400);

          return () => clearInterval(interval);
        }, [isMonitoringActive, manualSensorMode]);

        // Compute 5-minute rolling statistics & SVG chart points
        const nowTime = Date.now();
        const validHistory = stabilityHistory.filter((pt) => nowTime - pt.time <= 300000);

        let currentPeak = 0;
        let peakMss = 0;
        let avgAccValue = 0;
        let avgMss = 0;

        if (validHistory.length > 0) {
          let sumVal = 0;
          let sumMss = 0;
          validHistory.forEach((pt) => {
            if (pt.value > currentPeak) currentPeak = pt.value;
            if (pt.mss > peakMss) peakMss = pt.mss;
            sumVal += pt.value;
            sumMss += pt.mss;
          });
          avgAccValue = sumVal / validHistory.length;
          avgMss = sumMss / validHistory.length;
        }

        let svgPathPoints = '';
        let latestSvgX = null;
        let latestSvgY = null;

        if (validHistory.length > 0) {
          const points = validHistory.map((pt) => {

            const y = 155 - (Math.min(100, Math.max(0, pt.value)) / 100) * 140;
            return { x, y };

                    </div>
                    <div className="w-full h-3 bg-slate-950 rounded-full p-0.5 border border-slate-800">
                      <div 
                        className={`h-full rounded-full transition-colors duration-300 ${altLocked ? 'bg-emerald-500' : 'bg-gradient-to-r from-cyan-500 to-indigo-500'}`}
                        style={{ width: `${Math.min(100, (rawPitch / 90) * 100)}%` }}
                      ></div>
                    </div>
                  </div>
                </div>

                {/* 3. MOUNT STABILITY MONITOR CARD */}

                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="p-1.5 rounded-xl bg-cyan-500/20 text-cyan-400">
                        <Icon name="activity" className="w-4 h-4 animate-pulse" />
                      </div>
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider opacity-75 block">3. Mount Stability Monitor</span>
                        <span className="text-[10px] text-slate-400">Rolling 5-Min Vibration Analysis</span>
                      </div>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                        !isMonitoringActive
                          ? 'bg-slate-800 text-slate-400'
                          : currentPeak >= 80
                          ? 'bg-red-500/20 text-red-400 border border-red-500/30'
                          : currentPeak >= 40
                          ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                          : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'

                      <div className="text-[10px] text-slate-400 uppercase font-sans">Current</div>
                      <div className={`font-bold ${currentAccValue >= 80 ? 'text-red-400' : currentAccValue >= 40 ? 'text-amber-400' : 'text-cyan-400'}`}>
                        {currentAccValue.toFixed(1)}%
                      </div>
                      <div className="text-[9px] text-slate-500">{currentMss.toFixed(3)} m/s²</div>
                    </div>
                    <div className="space-y-0.5 border-x border-slate-800/60">
                      <div className="text-[10px] text-slate-400 uppercase font-sans">5-Min Peak</div>
                      <div className={`font-bold ${currentPeak >= 80 ? 'text-red-400' : currentPeak >= 40 ? 'text-amber-400' : 'text-emerald-400'}`}>
                        {currentPeak.toFixed(1)}%
                      </div>
                      <div className="text-[9px] text-slate-500">{peakMss.toFixed(3)} m/s²</div>
                    </div>
                    <div className="space-y-0.5">
                      <div className="text-[10px] text-slate-400 uppercase font-sans">5-Min Avg</div>

                      <text x="28" y="102" fill="#f59e0b" fontSize="8" fontFamily="monospace" textAnchor="end">40%</text>
                      <text x="28" y="158" fill="#64748b" fontSize="8" fontFamily="monospace" textAnchor="end">0%</text>

                        { label: '-2m', x: 186.8 },

                      ].map((item) => (

                      {svgPathPoints && (

                          d={svgPathPoints}
                          fill="none"

                          strokeLinecap="round"
                          strokeLinejoin="round"

                      {latestSvgX !== null && latestSvgY !== null && (
                        <g>
                          <circle cx={latestSvgX} cy={latestSvgY} r="4" fill={currentAccValue >= 80 ? '#ef4444' : currentAccValue >= 40 ? '#f59e0b' : '#06b6d4'} className="animate-ping" opacity="0.7" />

                    <div>

                    {isCalibrating ? (

                        <button

              </div>
            )}

            {/* MANUAL LOCATION MODAL */}
            {showManualModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-sm text-white flex items-center gap-2">
                      <Icon name="map-pin" className="w-4 h-4 text-cyan-400" /> Enter Manual Coordinates
                    </h3>
                    <button onClick={() => setShowManualModal(false)} className="p-1 text-slate-400 hover:text-white cursor-pointer">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                  
                  <form onSubmit={handleApplyManualGps} className="space-y-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Latitude (-90 to 90)</label>
                      <input
                        type="number"
                        step="0.0001"
                        value={manualLatInput}
                        onChange={(e) => setManualLatInput(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Longitude (-180 to 180)</label>
                      <input
                        type="number"
                        step="0.0001"
                        value={manualLonInput}
                        onChange={(e) => setManualLonInput(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-500"
                        required
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-xs shadow transition-all cursor-pointer"
                    >
                      Apply Location & Calculate Declination
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* FOOTER */}
            <footer className="mt-3 text-center text-[11px] text-slate-500 space-y-1">
              <div>Simple Polar Align • Real-Time GPS & Orientation Sensors</div>
              <div>
                ©️ by{' '}
                <a
                  href="https://www.mrrat.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-cyan-400 hover:text-cyan-300 underline font-medium transition-colors"
                >
                  MrRat.com
                </a>
              </div>
            </footer>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(
            (reg) => console.log('PWA ServiceWorker registered:', reg.scope),
            (err) => console.log('PWA ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
